<VirtualHost *:80>
    ServerName buitrago.geomaticaupv.es
    DocumentRoot /var/www/html/buitrago.geomaticaupv.es

    <Directory /var/www/html/buitrago.geomaticaupv.es>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On

    <Proxy *>
        Require all granted
    </Proxy>

    <Location /api/>
        ProxyPass http://127.0.0.1:8006/
        ProxyPassReverse http://127.0.0.1:8006/
    </Location>

    <Location /geoserver/>
        ProxyPass http://127.0.0.1:7006/geoserver/
        ProxyPassReverse http://127.0.0.1:7006/geoserver/
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/buitrago.geomaticaupv.es-error.log
    CustomLog ${APACHE_LOG_DIR}/buitrago.geomaticaupv.es-access.log combined
</VirtualHost>
